<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="hr-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1611" />
      <stop offset="50%" stop-color="#141F18" />
      <stop offset="100%" stop-color="#0E0E10" />
    </linearGradient>
    <linearGradient id="ndvi-curve" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="40%" stop-color="#34D399" />
      <stop offset="70%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#FF5A36" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#hr-bg)" />

  <!-- Dashboard Container -->
  <g transform="translate(100, 80)" filter="url(#glow)">
    <rect width="1000" height="590" rx="24" fill="#141B16" stroke="#25352A" stroke-width="2"/>

    <!-- Top Bar -->
    <rect width="1000" height="64" rx="24" fill="#18231C" />
    <text x="36" y="40" fill="#F4EFE6" font-family="'Syne', sans-serif" font-weight="700" font-size="16" letter-spacing="1">HARVEST RESCUE AI</text>
    <rect x="230" y="24" width="160" height="24" rx="12" fill="#34D399" fill-opacity="0.15" stroke="#34D399" stroke-width="1"/>
    <circle cx="244" cy="36" r="4" fill="#34D399" />
    <text x="256" y="40" fill="#34D399" font-family="'DM Mono', monospace" font-size="11">NDVI TELEMETRY ACTIVE</text>
    <text x="800" y="40" fill="#8F8F9D" font-family="'DM Mono', monospace" font-size="12">FARM: KANO SECTOR 4</text>

    <!-- Main NDVI Analysis Panel -->
    <g transform="translate(36, 90)">
      <rect width="600" height="320" rx="16" fill="#1A261F" stroke="#2C3D32" stroke-width="1"/>
      <text x="28" y="38" fill="#F4EFE6" font-family="'Syne', sans-serif" font-weight="700" font-size="16">Vegetation Health Index (NDVI) Forecast</text>
      <text x="28" y="58" fill="#8F8F9D" font-family="'Familjen Grotesk', sans-serif" font-size="12">14-Day threat horizon calculated from satellite multi-spectral telemetry</text>

      <!-- Graph Grid Lines -->
      <g stroke="#ffffff" stroke-opacity="0.08" stroke-dasharray="4,4">
        <line x1="40" y1="90" x2="560" y2="90" />
        <line x1="40" y1="150" x2="560" y2="150" />
        <line x1="40" y1="210" x2="560" y2="210" />
        <line x1="40" y1="270" x2="560" y2="270" />
      </g>

      <!-- Threat Zone Shading -->
      <rect x="380" y="90" width="180" height="180" fill="#FF5A36" fill-opacity="0.08" />
      <text x="400" y="115" fill="#FF5A36" font-family="'DM Mono', monospace" font-size="11" font-weight="700">ALERT: ANOMALY WINDOW</text>

      <!-- NDVI Line -->
      <path d="M 40 120 C 120 110, 180 130, 260 140 C 340 150, 390 190, 450 240 C 490 260, 530 250, 560 255" fill="none" stroke="url(#ndvi-curve)" stroke-width="4"/>

      <!-- Data Point Pulse -->
      <circle cx="450" cy="240" r="7" fill="#FF5A36" />
      <circle cx="450" cy="240" r="14" fill="#FF5A36" fill-opacity="0.3" />

      <!-- X-axis Labels -->
      <text x="40" y="295" fill="#8F8F9D" font-family="'DM Mono', monospace" font-size="10">DAY 0</text>
      <text x="180" y="295" fill="#8F8F9D" font-family="'DM Mono', monospace" font-size="10">DAY 4</text>
      <text x="320" y="295" fill="#8F8F9D" font-family="'DM Mono', monospace" font-size="10">DAY 8</text>
      <text x="440" y="295" fill="#FF5A36" font-family="'DM Mono', monospace" font-size="10">DAY 11 (THREAT)</text>
      <text x="540" y="295" fill="#8F8F9D" font-family="'DM Mono', monospace" font-size="10">DAY 14</text>
    </g>

    <!-- Swift Agent Sidebar -->
    <g transform="translate(660, 90)">
      <rect width="304" height="460" rx="16" fill="#1B2820" stroke="#314537" stroke-width="1"/>
      <!-- Agent Header -->
      <rect width="304" height="60" rx="16" fill="#223329" />
      <circle cx="32" cy="30" r="14" fill="#34D399" />
      <text x="56" y="28" fill="#F4EFE6" font-family="'Syne', sans-serif" font-weight="700" font-size="13">Swift Agent</text>
      <text x="56" y="44" fill="#34D399" font-family="'DM Mono', monospace" font-size="10">Autonomous Agronomist</text>

      <!-- Message Bubbles -->
      <g transform="translate(16, 75)">
        <rect width="272" height="70" rx="12" fill="#152119" stroke="#25352A" stroke-width="1"/>
        <text x="14" y="24" fill="#FF5A36" font-family="'DM Mono', monospace" font-size="11" font-weight="700">RISK DETECTED IN 9 DAYS</text>
        <text x="14" y="42" fill="#F4EFE6" font-family="'Familjen Grotesk', sans-serif" font-size="11">Precipitation deficit + NDVI dip indicates</text>
        <text x="14" y="58" fill="#F4EFE6" font-family="'Familjen Grotesk', sans-serif" font-size="11">early moisture stress in Maize Zone B.</text>
      </g>

      <g transform="translate(16, 160)">
        <rect width="272" height="110" rx="12" fill="#25352A" />
        <text x="14" y="24" fill="#34D399" font-family="'DM Mono', monospace" font-size="10">RECOMMENDED ACTION</text>
        <text x="14" y="46" fill="#F4EFE6" font-family="'Familjen Grotesk', sans-serif" font-size="11">1. Schedule irrigation window by Thursday.</text>
        <text x="14" y="66" fill="#F4EFE6" font-family="'Familjen Grotesk', sans-serif" font-size="11">2. Delay granular fertilizer application.</text>
        <text x="14" y="86" fill="#F4EFE6" font-family="'Familjen Grotesk', sans-serif" font-size="11">3. Check soil perimeter moisture sensor.</text>
      </g>

      <g transform="translate(16, 290)">
        <rect width="272" height="145" rx="12" fill="#152119" stroke="#283A2E" stroke-width="1"/>
        <text x="14" y="24" fill="#8F8F9D" font-family="'DM Mono', monospace" font-size="10">FIELD PARAMETERS</text>
        <text x="14" y="50" fill="#F4EFE6" font-family="'Familjen Grotesk', sans-serif" font-size="11">Crop: Hybrid White Maize</text>
        <text x="14" y="72" fill="#F4EFE6" font-family="'Familjen Grotesk', sans-serif" font-size="11">Coordinates: 11.96° N, 8.52° E</text>
        <text x="14" y="94" fill="#F4EFE6" font-family="'Familjen Grotesk', sans-serif" font-size="11">Planting Date: Week 12</text>
        <rect x="14" y="106" width="130" height="24" rx="12" fill="#34D399" />
        <text x="24" y="122" fill="#0E1611" font-family="'DM Mono', monospace" font-size="9" font-weight="700">GENERATE SMS</text>
      </g>
    </g>

    <!-- Bottom Metrics -->
    <g transform="translate(36, 430)">
      <rect width="180" height="120" rx="12" fill="#19251E" stroke="#2C3D32" stroke-width="1"/>
      <text x="16" y="28" fill="#8F8F9D" font-family="'DM Mono', monospace" font-size="10">CURRENT NDVI</text>
      <text x="16" y="64" fill="#34D399" font-family="'Syne', sans-serif" font-weight="700" font-size="28">0.68</text>
      <text x="16" y="90" fill="#8F8F9D" font-family="'Familjen Grotesk', sans-serif" font-size="11">Healthy canopy</text>
    </g>

    <g transform="translate(240, 430)">
      <rect width="180" height="120" rx="12" fill="#19251E" stroke="#2C3D32" stroke-width="1"/>
      <text x="16" y="28" fill="#8F8F9D" font-family="'DM Mono', monospace" font-size="10">PREDICTED (DAY 11)</text>
      <text x="16" y="64" fill="#FF5A36" font-family="'Syne', sans-serif" font-weight="700" font-size="28">0.39</text>
      <text x="16" y="90" fill="#FF5A36" font-family="'Familjen Grotesk', sans-serif" font-size="11">Stress threshold alert</text>
    </g>

    <g transform="translate(444, 430)">
      <rect width="192" height="120" rx="12" fill="#19251E" stroke="#2C3D32" stroke-width="1"/>
      <text x="16" y="28" fill="#8F8F9D" font-family="'DM Mono', monospace" font-size="10">ACTION WINDOW</text>
      <text x="16" y="64" fill="#2DD4BF" font-family="'Syne', sans-serif" font-weight="700" font-size="28">9 Days</text>
      <text x="16" y="90" fill="#2DD4BF" font-family="'Familjen Grotesk', sans-serif" font-size="11">To prevent loss</text>
    </g>
  </g>
</svg>
