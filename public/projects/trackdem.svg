<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="td-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141720" />
      <stop offset="50%" stop-color="#10121A" />
      <stop offset="100%" stop-color="#0E0E10" />
    </linearGradient>
    <filter id="td-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#td-bg)" />

  <!-- Hackathon Badge Ribbon -->
  <g transform="translate(100, 60)">
    <rect width="420" height="36" rx="18" fill="#3B82F6" fill-opacity="0.15" stroke="#3B82F6" stroke-width="1"/>
    <circle cx="20" cy="18" r="6" fill="#3B82F6" />
    <text x="36" y="22" fill="#60A5FA" font-family="'DM Mono', monospace" font-size="12" font-weight="700">2024 3MTT HACKATHON RIVERS STATE • TOP 5</text>
  </g>

  <!-- Main School Attendance Dashboard -->
  <g transform="translate(100, 120)" filter="url(#td-shadow)">
    <rect width="1000" height="540" rx="24" fill="#141722" stroke="#252A3D" stroke-width="2"/>

    <!-- Header Bar -->
    <rect width="1000" height="64" rx="24" fill="#1B2030" />
    <text x="36" y="40" fill="#F4EFE6" font-family="'Syne', sans-serif" font-weight="700" font-size="16">TRACKDEM • SCHOOL ATTENDANCE SYSTEM</text>
    <text x="800" y="40" fill="#8F8F9D" font-family="'DM Mono', monospace" font-size="11">CLASS: SS2 SCIENCE B</text>

    <!-- Stat Summary Pills -->
    <g transform="translate(36, 90)">
      <rect width="210" height="80" rx="14" fill="#1A2033" stroke="#2B3654" stroke-width="1"/>
      <text x="20" y="30" fill="#8F8F9D" font-family="'DM Mono', monospace" font-size="10">TOTAL ENROLLED</text>
      <text x="20" y="62" fill="#F4EFE6" font-family="'Syne', sans-serif" font-weight="700" font-size="24">48 Students</text>
    </g>

    <g transform="translate(266, 90)">
      <rect width="210" height="80" rx="14" fill="#1A2033" stroke="#2B3654" stroke-width="1"/>
      <text x="20" y="30" fill="#2DD4BF" font-family="'DM Mono', monospace" font-size="10">MARKED PRESENT</text>
      <text x="20" y="62" fill="#2DD4BF" font-family="'Syne', sans-serif" font-weight="700" font-size="24">45 (93.7%)</text>
    </g>

    <g transform="translate(496, 90)">
      <rect width="210" height="80" rx="14" fill="#1A2033" stroke="#2B3654" stroke-width="1"/>
      <text x="20" y="30" fill="#FF5A36" font-family="'DM Mono', monospace" font-size="10">UNEXCUSED ABSENT</text>
      <text x="20" y="62" fill="#FF5A36" font-family="'Syne', sans-serif" font-weight="700" font-size="24">3 Students</text>
    </g>

    <g transform="translate(726, 90)">
      <rect width="238" height="80" rx="14" fill="#1A2033" stroke="#2B3654" stroke-width="1"/>
      <text x="20" y="30" fill="#60A5FA" font-family="'DM Mono', monospace" font-size="10">ROLL CALL SPEED</text>
      <text x="20" y="62" fill="#60A5FA" font-family="'Syne', sans-serif" font-weight="700" font-size="24">1m 14s</text>
    </g>

    <!-- Table of Student Records -->
    <g transform="translate(36, 190)">
      <rect width="928" height="310" rx="16" fill="#181D2C" stroke="#273048" stroke-width="1"/>
      <!-- Table Header -->
      <text x="24" y="32" fill="#8F8F9D" font-family="'DM Mono', monospace" font-size="11">STUDENT ID</text>
      <text x="180" y="32" fill="#8F8F9D" font-family="'DM Mono', monospace" font-size="11">FULL NAME</text>
      <text x="440" y="32" fill="#8F8F9D" font-family="'DM Mono', monospace" font-size="11">TIMESTAMP</text>
      <text x="640" y="32" fill="#8F8F9D" font-family="'DM Mono', monospace" font-size="11">STATUS</text>
      <text x="820" y="32" fill="#8F8F9D" font-family="'DM Mono', monospace" font-size="11">PARENT SMS</text>
      <line x1="0" y1="48" x2="928" y2="48" stroke="#2B3654" stroke-width="1"/>

      <!-- Row 1 -->
      <text x="24" y="80" fill="#60A5FA" font-family="'DM Mono', monospace" font-size="12">STU-2024-001</text>
      <text x="180" y="80" fill="#F4EFE6" font-family="'Familjen Grotesk', sans-serif" font-size="13" font-weight="600">Amadi, Chidera</text>
      <text x="440" y="80" fill="#8F8F9D" font-family="'DM Mono', monospace" font-size="11">07:42 AM WAT</text>
      <rect x="640" y="64" width="76" height="22" rx="11" fill="#2DD4BF" fill-opacity="0.15"/>
      <text x="654" y="79" fill="#2DD4BF" font-family="'DM Mono', monospace" font-size="10">PRESENT</text>
      <text x="820" y="80" fill="#8F8F9D" font-family="'DM Mono', monospace" font-size="11">Delivered</text>
      <line x1="20" y1="100" x2="908" y2="100" stroke="#242B40" stroke-width="1"/>

      <!-- Row 2 -->
      <text x="24" y="132" fill="#60A5FA" font-family="'DM Mono', monospace" font-size="12">STU-2024-002</text>
      <text x="180" y="132" fill="#F4EFE6" font-family="'Familjen Grotesk', sans-serif" font-size="13" font-weight="600">Bello, Fatima</text>
      <text x="440" y="132" fill="#8F8F9D" font-family="'DM Mono', monospace" font-size="11">07:51 AM WAT</text>
      <rect x="640" y="116" width="76" height="22" rx="11" fill="#2DD4BF" fill-opacity="0.15"/>
      <text x="654" y="131" fill="#2DD4BF" font-family="'DM Mono', monospace" font-size="10">PRESENT</text>
      <text x="820" y="132" fill="#8F8F9D" font-family="'DM Mono', monospace" font-size="11">Delivered</text>
      <line x1="20" y1="152" x2="908" y2="152" stroke="#242B40" stroke-width="1"/>

      <!-- Row 3 (Absent) -->
      <text x="24" y="184" fill="#60A5FA" font-family="'DM Mono', monospace" font-size="12">STU-2024-003</text>
      <text x="180" y="184" fill="#F4EFE6" font-family="'Familjen Grotesk', sans-serif" font-size="13" font-weight="600">Okonkwo, Emeka</text>
      <text x="440" y="184" fill="#8F8F9D" font-family="'DM Mono', monospace" font-size="11">--:-- --</text>
      <rect x="640" y="168" width="76" height="22" rx="11" fill="#FF5A36" fill-opacity="0.15"/>
      <text x="656" y="183" fill="#FF5A36" font-family="'DM Mono', monospace" font-size="10">ABSENT</text>
      <text x="820" y="184" fill="#FF5A36" font-family="'DM Mono', monospace" font-size="11">Triggered Alert</text>
      <line x1="20" y1="204" x2="908" y2="204" stroke="#242B40" stroke-width="1"/>

      <!-- Row 4 -->
      <text x="24" y="236" fill="#60A5FA" font-family="'DM Mono', monospace" font-size="12">STU-2024-004</text>
      <text x="180" y="236" fill="#F4EFE6" font-family="'Familjen Grotesk', sans-serif" font-size="13" font-weight="600">Williams, Tonye</text>
      <text x="440" y="236" fill="#8F8F9D" font-family="'DM Mono', monospace" font-size="11">07:55 AM WAT</text>
      <rect x="640" y="220" width="76" height="22" rx="11" fill="#2DD4BF" fill-opacity="0.15"/>
      <text x="654" y="235" fill="#2DD4BF" font-family="'DM Mono', monospace" font-size="10">PRESENT</text>
      <text x="820" y="236" fill="#8F8F9D" font-family="'DM Mono', monospace" font-size="11">Delivered</text>
    </g>
  </g>
</svg>
