<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="tm-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14181B" />
      <stop offset="50%" stop-color="#101417" />
      <stop offset="100%" stop-color="#0E0E10" />
    </linearGradient>
    <filter id="tm-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#tm-bg)" />

  <!-- Capstone Badge Ribbon -->
  <g transform="translate(100, 60)">
    <rect width="360" height="36" rx="18" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="1"/>
    <circle cx="20" cy="18" r="6" fill="#10B981" />
    <text x="36" y="22" fill="#10B981" font-family="'DM Mono', monospace" font-size="12" font-weight="700">3MTT PROGRAMME CAPSTONE PROJECT</text>
  </g>

  <!-- Main Kanban / Task Dashboard -->
  <g transform="translate(100, 120)" filter="url(#tm-shadow)">
    <rect width="1000" height="540" rx="24" fill="#151A1E" stroke="#263138" stroke-width="2"/>

    <!-- App Header -->
    <rect width="1000" height="64" rx="24" fill="#1C2329" />
    <text x="36" y="40" fill="#F4EFE6" font-family="'Syne', sans-serif" font-weight="700" font-size="16">TASK MANAGER • 3MTT CAPSTONE</text>
    <rect x="800" y="20" width="160" height="26" rx="13" fill="#10B981" fill-opacity="0.2"/>
    <text x="880" y="37" fill="#10B981" font-family="'DM Mono', monospace" font-size="11" text-anchor="middle">SPRINT VELOCITY: 92%</text>

    <!-- Column 1: Backlog / To Do -->
    <g transform="translate(36, 90)">
      <rect width="288" height="420" rx="16" fill="#182026" stroke="#25323C" stroke-width="1"/>
      <text x="20" y="36" fill="#8F8F9D" font-family="'DM Mono', monospace" font-size="11">TO DO (3)</text>
      <circle cx="260" cy="32" r="4" fill="#8F8F9D" />

      <!-- Card 1 -->
      <g transform="translate(16, 56)">
        <rect width="256" height="96" rx="10" fill="#202A33" stroke="#2E3C48" stroke-width="1"/>
        <rect x="14" y="14" width="70" height="18" rx="4" fill="#EF4444" fill-opacity="0.2"/>
        <text x="20" y="27" fill="#EF4444" font-family="'DM Mono', monospace" font-size="9" font-weight="700">HIGH PRIORITY</text>
        <text x="14" y="56" fill="#F4EFE6" font-family="'Familjen Grotesk', sans-serif" font-weight="600" font-size="13">Implement Task Filter by Tag</text>
        <text x="14" y="78" fill="#8F8F9D" font-family="'DM Mono', monospace" font-size="10">Due: Tomorrow • Personal</text>
      </g>

      <!-- Card 2 -->
      <g transform="translate(16, 164)">
        <rect width="256" height="96" rx="10" fill="#202A33" stroke="#2E3C48" stroke-width="1"/>
        <rect x="14" y="14" width="76" height="18" rx="4" fill="#F59E0B" fill-opacity="0.2"/>
        <text x="20" y="27" fill="#F59E0B" font-family="'DM Mono', monospace" font-size="9" font-weight="700">MEDIUM PRIORITY</text>
        <text x="14" y="56" fill="#F4EFE6" font-family="'Familjen Grotesk', sans-serif" font-weight="600" font-size="13">Export CSV Project Summary</text>
        <text x="14" y="78" fill="#8F8F9D" font-family="'DM Mono', monospace" font-size="10">Due: Friday • Analytics</text>
      </g>
    </g>

    <!-- Column 2: In Progress -->
    <g transform="translate(356, 90)">
      <rect width="288" height="420" rx="16" fill="#182026" stroke="#25323C" stroke-width="1"/>
      <text x="20" y="36" fill="#38BDF8" font-family="'DM Mono', monospace" font-size="11">IN PROGRESS (2)</text>
      <circle cx="260" cy="32" r="4" fill="#38BDF8" />

      <!-- Card 1 -->
      <g transform="translate(16, 56)">
        <rect width="256" height="110" rx="10" fill="#202A33" stroke="#38BDF8" stroke-width="1"/>
        <rect x="14" y="14" width="84" height="18" rx="4" fill="#38BDF8" fill-opacity="0.2"/>
        <text x="20" y="27" fill="#38BDF8" font-family="'DM Mono', monospace" font-size="9" font-weight="700">IN DEVELOPMENT</text>
        <text x="14" y="56" fill="#F4EFE6" font-family="'Familjen Grotesk', sans-serif" font-weight="600" font-size="13">Drag-and-Drop Reordering</text>
        <text x="14" y="76" fill="#8F8F9D" font-family="'Familjen Grotesk', sans-serif" font-size="11">Optimistic UI state with local storage</text>
        <!-- Mini Progress Bar -->
        <rect x="14" y="90" width="228" height="4" rx="2" fill="#14181B" />
        <rect x="14" y="90" width="170" height="4" rx="2" fill="#38BDF8" />
      </g>
    </g>

    <!-- Column 3: Completed -->
    <g transform="translate(676, 90)">
      <rect width="288" height="420" rx="16" fill="#182026" stroke="#25323C" stroke-width="1"/>
      <text x="20" y="36" fill="#10B981" font-family="'DM Mono', monospace" font-size="11">COMPLETED (8)</text>
      <circle cx="260" cy="32" r="4" fill="#10B981" />

      <!-- Card 1 -->
      <g transform="translate(16, 56)">
        <rect width="256" height="84" rx="10" fill="#1B2524" stroke="#274036" stroke-width="1"/>
        <circle cx="26" cy="30" r="10" fill="#10B981" fill-opacity="0.2"/>
        <text x="26" y="34" fill="#10B981" font-family="'DM Mono', monospace" font-size="11" text-anchor="middle">✓</text>
        <text x="46" y="34" fill="#F4EFE6" font-family="'Familjen Grotesk', sans-serif" font-weight="600" font-size="13">3MTT Final Capstone Review</text>
        <text x="46" y="58" fill="#10B981" font-family="'DM Mono', monospace" font-size="10">Passed with distinction</text>
      </g>

      <!-- Card 2 -->
      <g transform="translate(16, 152)">
        <rect width="256" height="84" rx="10" fill="#1B2524" stroke="#274036" stroke-width="1"/>
        <circle cx="26" cy="30" r="10" fill="#10B981" fill-opacity="0.2"/>
        <text x="26" y="34" fill="#10B981" font-family="'DM Mono', monospace" font-size="11" text-anchor="middle">✓</text>
        <text x="46" y="34" fill="#F4EFE6" font-family="'Familjen Grotesk', sans-serif" font-weight="600" font-size="13">Persistent Local State</text>
        <text x="46" y="58" fill="#8F8F9D" font-family="'DM Mono', monospace" font-size="10">IndexedDB sync verified</text>
      </g>
    </g>
  </g>
</svg>
