<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="rc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141419" />
      <stop offset="50%" stop-color="#1E1A16" />
      <stop offset="100%" stop-color="#0E0E10" />
    </linearGradient>
    <linearGradient id="rc-clay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E87A5D" />
      <stop offset="100%" stop-color="#B34B30" />
    </linearGradient>
    <linearGradient id="rc-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#25242C" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#191920" stop-opacity="0.9" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="url(#rc-bg)" />

  <!-- Subtle grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="750" />
    <line x1="300" y1="0" x2="300" y2="750" />
    <line x1="600" y1="0" x2="600" y2="750" />
    <line x1="900" y1="0" x2="900" y2="750" />
    <line x1="1100" y1="0" x2="1100" y2="750" />
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="375" x2="1200" y2="375" />
    <line x1="0" y1="600" x2="1200" y2="600" />
  </g>

  <!-- Central Mobile Device Mockup Frame -->
  <g transform="translate(420, 50)" filter="url(#shadow)">
    <!-- Phone Body -->
    <rect x="0" y="0" width="360" height="650" rx="36" fill="#15151B" stroke="#33333E" stroke-width="2"/>
    <rect x="8" y="8" width="344" height="634" rx="28" fill="#181820" />

    <!-- Notch / Dynamic Island -->
    <rect x="135" y="18" width="90" height="20" rx="10" fill="#0E0E10" />

    <!-- App Header -->
    <text x="32" y="72" fill="#F4EFE6" font-family="'Syne', sans-serif" font-weight="700" font-size="16" letter-spacing="1">RIGHTS COMPASS</text>
    <rect x="236" y="58" width="92" height="22" rx="11" fill="#FF5A36" fill-opacity="0.2" stroke="#FF5A36" stroke-width="1"/>
    <circle cx="248" cy="69" r="4" fill="#2DD4BF" />
    <text x="258" y="73" fill="#F4EFE6" font-family="'DM Mono', monospace" font-size="10">OFFLINE SYNC</text>

    <!-- AI Tutor Banner with Clay Owl Mascot -->
    <g transform="translate(24, 96)">
      <rect x="0" y="0" width="312" height="110" rx="18" fill="url(#rc-card)" stroke="#3A3845" stroke-width="1"/>
      <!-- Owl Mascot Stylized Icon -->
      <g transform="translate(20, 20)">
        <circle cx="35" cy="35" r="32" fill="url(#rc-clay)" />
        <!-- Big Eyes -->
        <circle cx="26" cy="30" r="11" fill="#FFFFFF" />
        <circle cx="44" cy="30" r="11" fill="#FFFFFF" />
        <circle cx="27" cy="30" r="5" fill="#0E0E10" />
        <circle cx="45" cy="30" r="5" fill="#0E0E10" />
        <circle cx="29" cy="28" r="2" fill="#FFFFFF" />
        <circle cx="47" cy="28" r="2" fill="#FFFFFF" />
        <!-- Beak -->
        <polygon points="35,38 31,46 39,46" fill="#FFB703" />
        <!-- Ears / Tufts -->
        <polygon points="12,14 18,24 10,24" fill="#9F3C24" />
        <polygon points="58,14 52,24 60,24" fill="#9F3C24" />
      </g>
      <text x="96" y="38" fill="#F4EFE6" font-family="'Familjen Grotesk', sans-serif" font-weight="700" font-size="14">AI Legal Tutor</text>
      <text x="96" y="58" fill="#8F8F9D" font-family="'Familjen Grotesk', sans-serif" font-size="11">Ask any question on citizen</text>
      <text x="96" y="73" fill="#8F8F9D" font-family="'Familjen Grotesk', sans-serif" font-size="11">rights &amp; police interactions.</text>
      <rect x="96" y="80" width="130" height="18" rx="9" fill="#FF5A36" />
      <text x="110" y="93" fill="#FFFFFF" font-family="'DM Mono', monospace" font-size="9" font-weight="700">START VOICE SESSION</text>
    </g>

    <!-- Fundamental Rights Quick Cards -->
    <text x="24" y="235" fill="#8F8F9D" font-family="'DM Mono', monospace" font-size="10" letter-spacing="1.5">CONSTITUTIONAL LIBRARY</text>
    
    <g transform="translate(24, 250)">
      <rect x="0" y="0" width="312" height="64" rx="14" fill="#1C1C24" stroke="#2D2D38" stroke-width="1"/>
      <rect x="14" y="14" width="36" height="36" rx="10" fill="#FF5A36" fill-opacity="0.15" />
      <text x="26" y="37" fill="#FF5A36" font-family="'DM Mono', monospace" font-size="14" font-weight="700">§4</text>
      <text x="60" y="32" fill="#F4EFE6" font-family="'Familjen Grotesk', sans-serif" font-weight="600" font-size="13">Section 35: Personal Liberty</text>
      <text x="60" y="48" fill="#8F8F9D" font-family="'Familjen Grotesk', sans-serif" font-size="11">Unlawful detention &amp; 24h bail rule</text>
    </g>

    <g transform="translate(24, 324)">
      <rect x="0" y="0" width="312" height="64" rx="14" fill="#1C1C24" stroke="#2D2D38" stroke-width="1"/>
      <rect x="14" y="14" width="36" height="36" rx="10" fill="#2DD4BF" fill-opacity="0.15" />
      <text x="26" y="37" fill="#2DD4BF" font-family="'DM Mono', monospace" font-size="14" font-weight="700">§3</text>
      <text x="60" y="32" fill="#F4EFE6" font-family="'Familjen Grotesk', sans-serif" font-weight="600" font-size="13">Section 37: Right to Privacy</text>
      <text x="60" y="48" fill="#8F8F9D" font-family="'Familjen Grotesk', sans-serif" font-size="11">Searches of phones, homes, luggage</text>
    </g>

    <!-- Lawyer Marketplace Waitlist & Escrow Badge -->
    <g transform="translate(24, 400)">
      <rect x="0" y="0" width="312" height="140" rx="16" fill="#16161D" stroke="#3A2C26" stroke-width="1"/>
      <text x="18" y="28" fill="#FF5A36" font-family="'DM Mono', monospace" font-size="11" font-weight="700">ESCROW LAWYER MARKETPLACE</text>
      <text x="18" y="52" fill="#F4EFE6" font-family="'Familjen Grotesk', sans-serif" font-size="12">Verified against Nigerian Bar records.</text>
      <text x="18" y="70" fill="#8F8F9D" font-family="'Familjen Grotesk', sans-serif" font-size="11">Upfront client payment held in escrow.</text>
      <rect x="18" y="90" width="276" height="34" rx="10" fill="#23222B" stroke="#484654" stroke-width="1"/>
      <text x="32" y="112" fill="#2DD4BF" font-family="'DM Mono', monospace" font-size="11">WAITLIST LOCKED • NBA VERIFICATION</text>
    </g>

    <!-- Bottom 4-Tab Navigation -->
    <g transform="translate(0, 574)">
      <rect x="0" y="0" width="360" height="68" fill="#121217" />
      <line x1="0" y1="0" x2="360" y2="0" stroke="#252530" stroke-width="1"/>
      <text x="45" y="38" fill="#FF5A36" font-family="'DM Mono', monospace" font-size="10" text-anchor="middle">HOME</text>
      <circle cx="45" cy="48" r="2" fill="#FF5A36" />
      <text x="135" y="38" fill="#8F8F9D" font-family="'DM Mono', monospace" font-size="10" text-anchor="middle">LIBRARY</text>
      <text x="225" y="38" fill="#8F8F9D" font-family="'DM Mono', monospace" font-size="10" text-anchor="middle">MARKET</text>
      <text x="315" y="38" fill="#8F8F9D" font-family="'DM Mono', monospace" font-size="10" text-anchor="middle">PROFILE</text>
    </g>
  </g>

  <!-- Left Detail Card -->
  <g transform="translate(60, 220)" filter="url(#shadow)">
    <rect width="300" height="240" rx="16" fill="#16161C" stroke="#2B2B36" stroke-width="1"/>
    <text x="24" y="40" fill="#FF5A36" font-family="'DM Mono', monospace" font-size="11">ARCHITECTURAL HIGHLIGHT</text>
    <text x="24" y="72" fill="#F4EFE6" font-family="'Syne', sans-serif" font-weight="700" font-size="18">Offline-First Engine</text>
    <text x="24" y="104" fill="#8F8F9D" font-family="'Familjen Grotesk', sans-serif" font-size="13">Bundled statutory penal code</text>
    <text x="24" y="124" fill="#8F8F9D" font-family="'Familjen Grotesk', sans-serif" font-size="13">and local SQLite/storage caches.</text>
    <rect x="24" y="150" width="250" height="60" rx="8" fill="#0E0E10" />
    <text x="36" y="174" fill="#2DD4BF" font-family="'DM Mono', monospace" font-size="11">WhatsApp Cloud OTP</text>
    <text x="36" y="194" fill="#8F8F9D" font-family="'DM Mono', monospace" font-size="11">Paystack Escrow System</text>
  </g>

  <!-- Right Detail Card -->
  <g transform="translate(840, 220)" filter="url(#shadow)">
    <rect width="300" height="240" rx="16" fill="#16161C" stroke="#2B2B36" stroke-width="1"/>
    <text x="24" y="40" fill="#2DD4BF" font-family="'DM Mono', monospace" font-size="11">URGENT CALL PIPELINE</text>
    <text x="24" y="72" fill="#F4EFE6" font-family="'Syne', sans-serif" font-weight="700" font-size="18">Node.js AI Voice Bridge</text>
    <text x="24" y="104" fill="#8F8F9D" font-family="'Familjen Grotesk', sans-serif" font-size="13">Flags high-urgency distress,</text>
    <text x="24" y="124" fill="#8F8F9D" font-family="'Familjen Grotesk', sans-serif" font-size="13">initiating instant guidance voice</text>
    <text x="24" y="144" fill="#8F8F9D" font-family="'Familjen Grotesk', sans-serif" font-size="13">sessions before lawyer dispatch.</text>
    <rect x="24" y="168" width="160" height="30" rx="15" fill="#FF5A36" fill-opacity="0.15" stroke="#FF5A36" stroke-width="1" />
    <text x="38" y="188" fill="#FF5A36" font-family="'DM Mono', monospace" font-size="11">ACTIVE DEVELOPMENT</text>
  </g>
</svg>
