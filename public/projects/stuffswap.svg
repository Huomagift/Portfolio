<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="ss-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#19131C" />
      <stop offset="50%" stop-color="#141118" />
      <stop offset="100%" stop-color="#0E0E10" />
    </linearGradient>
    <linearGradient id="ss-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#BE185D" />
    </linearGradient>
    <filter id="ss-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#ss-bg)" />

  <!-- Hackathon Badge Ribbon -->
  <g transform="translate(100, 60)">
    <rect width="400" height="36" rx="18" fill="#F43F5E" fill-opacity="0.15" stroke="#F43F5E" stroke-width="1"/>
    <circle cx="20" cy="18" r="6" fill="#F43F5E" />
    <text x="36" y="22" fill="#F43F5E" font-family="'DM Mono', monospace" font-size="12" font-weight="700">CS GIRLIES HACKATHON 2025 • TOP 10 (9TH PLACE)</text>
  </g>

  <!-- Main Swap Match Interface -->
  <g transform="translate(100, 120)" filter="url(#ss-shadow)">
    <rect width="1000" height="540" rx="24" fill="#18151D" stroke="#2D2534" stroke-width="2"/>

    <!-- Header -->
    <rect width="1000" height="60" rx="24" fill="#1F1A26" />
    <text x="36" y="38" fill="#F4EFE6" font-family="'Syne', sans-serif" font-weight="700" font-size="16">STUFFSWAP • CASHLESS EXCHANGE</text>
    <rect x="740" y="16" width="220" height="28" rx="14" fill="#FF5A36" fill-opacity="0.15" stroke="#FF5A36" stroke-width="1"/>
    <text x="755" y="34" fill="#FF5A36" font-family="'DM Mono', monospace" font-size="11">AI MATCH ENGINE: ACTIVE</text>

    <!-- Side A: User Offering Item -->
    <g transform="translate(50, 90)">
      <rect width="360" height="400" rx="18" fill="#201B27" stroke="#362E42" stroke-width="1"/>
      <rect x="20" y="20" width="320" height="180" rx="12" fill="#2A2433" />
      <!-- Stylized Gadget Icon -->
      <circle cx="180" cy="110" r="45" fill="#3D354A" />
      <rect x="155" y="85" width="50" height="50" rx="10" fill="#F43F5E" fill-opacity="0.4" stroke="#F43F5E" stroke-width="1.5"/>
      <text x="180" y="115" fill="#FFFFFF" font-family="'DM Mono', monospace" font-size="11" text-anchor="middle">ELECTRONICS</text>

      <text x="24" y="235" fill="#8F8F9D" font-family="'DM Mono', monospace" font-size="11">YOU OFFER</text>
      <text x="24" y="260" fill="#F4EFE6" font-family="'Syne', sans-serif" font-weight="700" font-size="18">Mechanical Keyboard (Brown Switch)</text>
      <text x="24" y="285" fill="#8F8F9D" font-family="'Familjen Grotesk', sans-serif" font-size="12">Condition: 9/10 • Estimated utility: High</text>
      
      <rect x="24" y="315" width="312" height="60" rx="10" fill="#17131D" />
      <text x="38" y="340" fill="#2DD4BF" font-family="'DM Mono', monospace" font-size="11">Looking for: Portable Monitor / USB Hub</text>
      <text x="38" y="358" fill="#8F8F9D" font-family="'DM Mono', monospace" font-size="10">Cash requirement: ₦0 (Strict barter)</text>
    </g>

    <!-- Center Match Engine Hub -->
    <g transform="translate(450, 190)">
      <circle cx="50" cy="50" r="45" fill="#2D1F33" stroke="#F43F5E" stroke-width="2"/>
      <text x="50" y="46" fill="#F4EFE6" font-family="'Syne', sans-serif" font-weight="700" font-size="18" text-anchor="middle">94%</text>
      <text x="50" y="64" fill="#F43F5E" font-family="'DM Mono', monospace" font-size="10" text-anchor="middle">MATCH</text>
      
      <!-- Connectors -->
      <line x1="-30" y1="50" x2="5" y2="50" stroke="#F43F5E" stroke-width="2" stroke-dasharray="4,4"/>
      <line x1="95" y1="50" x2="130" y2="50" stroke="#2DD4BF" stroke-width="2" stroke-dasharray="4,4"/>

      <!-- Safe Meeting Zone Recommendation Box -->
      <g transform="translate(-110, 140)">
        <rect width="320" height="120" rx="14" fill="#1A1F26" stroke="#2E3D4D" stroke-width="1"/>
        <circle cx="30" cy="30" r="12" fill="#2DD4BF" fill-opacity="0.2"/>
        <text x="30" y="34" fill="#2DD4BF" font-family="'DM Mono', monospace" font-size="12" text-anchor="middle">📍</text>
        <text x="54" y="28" fill="#2DD4BF" font-family="'DM Mono', monospace" font-size="11" font-weight="700">RECOMMENDED SAFE HUB</text>
        <text x="54" y="44" fill="#F4EFE6" font-family="'Familjen Grotesk', sans-serif" font-weight="600" font-size="13">University Library Tech Annex</text>
        <text x="24" y="72" fill="#8F8F9D" font-family="'Familjen Grotesk', sans-serif" font-size="11">CCTV monitored, high pedestrian foot traffic, public security checkpoint verified.</text>
        <rect x="24" y="86" width="272" height="22" rx="6" fill="#2DD4BF" fill-opacity="0.15"/>
        <text x="36" y="100" fill="#2DD4BF" font-family="'DM Mono', monospace" font-size="10">SAFE MEETING PROTOCOL VERIFIED</text>
      </g>
    </g>

    <!-- Side B: Matched Item -->
    <g transform="translate(590, 90)">
      <rect width="360" height="400" rx="18" fill="#201B27" stroke="#362E42" stroke-width="1"/>
      <rect x="20" y="20" width="320" height="180" rx="12" fill="#2A2433" />
      <!-- Matched Item Icon -->
      <circle cx="180" cy="110" r="45" fill="#2F3937" />
      <rect x="155" y="85" width="50" height="50" rx="10" fill="#2DD4BF" fill-opacity="0.4" stroke="#2DD4BF" stroke-width="1.5"/>
      <text x="180" y="115" fill="#FFFFFF" font-family="'DM Mono', monospace" font-size="11" text-anchor="middle">HARDWARE</text>

      <text x="24" y="235" fill="#8F8F9D" font-family="'DM Mono', monospace" font-size="11">PEER OFFERS</text>
      <text x="24" y="260" fill="#F4EFE6" font-family="'Syne', sans-serif" font-weight="700" font-size="18">1080p IPS Portable Display</text>
      <text x="24" y="285" fill="#8F8F9D" font-family="'Familjen Grotesk', sans-serif" font-size="12">Condition: Like New • Seeking mechanical keys</text>

      <rect x="24" y="315" width="312" height="60" rx="10" fill="#17131D" />
      <text x="38" y="340" fill="#F43F5E" font-family="'DM Mono', monospace" font-size="11">AI Swap Evaluation: High Symmetry</text>
      <text x="38" y="358" fill="#8F8F9D" font-family="'DM Mono', monospace" font-size="10">Mutual utility gap: &lt; 4%</text>
    </g>
  </g>
</svg>
