<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <!--
    ==========================================================================
    NOTE FOR GIFT: SWAPPABLE IMAGE SLOT
    Replace this SVG placeholder with a high-resolution screenshot of
    the live site (https://www.artzaworld.com).
    Simply place artza-screenshot.png/webp in public/projects/ and update the path!
    ==========================================================================
  -->
  <defs>
    <linearGradient id="artza-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1614" />
      <stop offset="50%" stop-color="#141112" />
      <stop offset="100%" stop-color="#0E0E10" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="artza-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#artza-bg)" />

  <!-- Browser Window Mockup Frame -->
  <g transform="translate(100, 70)" filter="url(#artza-shadow)">
    <!-- Browser Chrome -->
    <rect width="1000" height="610" rx="18" fill="#171518" stroke="#332B32" stroke-width="2"/>
    <rect width="1000" height="50" rx="18" fill="#211E24" />
    
    <!-- Window Controls -->
    <circle cx="30" cy="25" r="6" fill="#EF4444" />
    <circle cx="50" cy="25" r="6" fill="#F59E0B" />
    <circle cx="70" cy="25" r="6" fill="#10B981" />

    <!-- Browser URL Bar -->
    <rect x="250" y="12" width="500" height="26" rx="13" fill="#151317" stroke="#3A333E" stroke-width="1"/>
    <text x="500" y="29" fill="#F4EFE6" font-family="'DM Mono', monospace" font-size="11" text-anchor="middle">https://www.artzaworld.com</text>

    <!-- Storefront Hero Banner -->
    <g transform="translate(36, 70)">
      <rect width="928" height="240" rx="14" fill="#261E21" stroke="#3D2E35" stroke-width="1"/>
      <text x="50" y="70" fill="#F59E0B" font-family="'DM Mono', monospace" font-size="11" letter-spacing="2">CURATED GIFTS &amp; BESPOKE PORTRAITS</text>
      <text x="50" y="120" fill="#F4EFE6" font-family="'Syne', sans-serif" font-weight="800" font-size="34">ARTZA WORLD</text>
      <text x="50" y="150" fill="#C5B8B1" font-family="'Familjen Grotesk', sans-serif" font-size="14">Luxury hampers, custom illustrations, and personalized celebrations.</text>
      
      <rect x="50" y="175" width="180" height="40" rx="20" fill="url(#gold-grad)"/>
      <text x="140" y="200" fill="#0E0E10" font-family="'Syne', sans-serif" font-weight="700" font-size="12" text-anchor="middle">ORDER ON WHATSAPP</text>

      <rect x="660" y="30" width="230" height="180" rx="12" fill="#1A1417" stroke="#3A2C33" stroke-width="1"/>
      <text x="775" y="115" fill="#C5B8B1" font-family="'Syne', sans-serif" font-size="14" text-anchor="middle">Luxury Gift Boxes</text>
      <text x="775" y="140" fill="#F59E0B" font-family="'DM Mono', monospace" font-size="11" text-anchor="middle">PORT HARCOURT DELIVERY</text>
    </g>

    <!-- Product Showcase Grid -->
    <g transform="translate(36, 330)">
      <!-- Item 1 -->
      <g transform="translate(0, 0)">
        <rect width="216" height="230" rx="12" fill="#201A20" stroke="#332B34" stroke-width="1"/>
        <rect x="14" y="14" width="188" height="130" rx="8" fill="#151217" />
        <text x="108" y="85" fill="#8F8F9D" font-family="'DM Mono', monospace" font-size="11" text-anchor="middle">GIFT HAMPER</text>
        <text x="16" y="170" fill="#F4EFE6" font-family="'Familjen Grotesk', sans-serif" font-weight="600" font-size="13">Royal Deluxe Hamper</text>
        <text x="16" y="190" fill="#F59E0B" font-family="'DM Mono', monospace" font-size="12">Customized items</text>
        <text x="16" y="210" fill="#8F8F9D" font-family="'DM Mono', monospace" font-size="10">WhatsApp checkout</text>
      </g>

      <!-- Item 2 -->
      <g transform="translate(236, 0)">
        <rect width="216" height="230" rx="12" fill="#201A20" stroke="#332B34" stroke-width="1"/>
        <rect x="14" y="14" width="188" height="130" rx="8" fill="#151217" />
        <text x="108" y="85" fill="#8F8F9D" font-family="'DM Mono', monospace" font-size="11" text-anchor="middle">PORTRAITS</text>
        <text x="16" y="170" fill="#F4EFE6" font-family="'Familjen Grotesk', sans-serif" font-weight="600" font-size="13">Framed Canvas Portrait</text>
        <text x="16" y="190" fill="#F59E0B" font-family="'DM Mono', monospace" font-size="12">A3 / A2 Handcrafted</text>
        <text x="16" y="210" fill="#8F8F9D" font-family="'DM Mono', monospace" font-size="10">WhatsApp checkout</text>
      </g>

      <!-- Item 3 -->
      <g transform="translate(472, 0)">
        <rect width="216" height="230" rx="12" fill="#201A20" stroke="#332B34" stroke-width="1"/>
        <rect x="14" y="14" width="188" height="130" rx="8" fill="#151217" />
        <text x="108" y="85" fill="#8F8F9D" font-family="'DM Mono', monospace" font-size="11" text-anchor="middle">CUSTOM MERCH</text>
        <text x="16" y="170" fill="#F4EFE6" font-family="'Familjen Grotesk', sans-serif" font-weight="600" font-size="13">Personalized Mugs &amp; Cards</text>
        <text x="16" y="190" fill="#F59E0B" font-family="'DM Mono', monospace" font-size="12">Laser-etched</text>
        <text x="16" y="210" fill="#8F8F9D" font-family="'DM Mono', monospace" font-size="10">WhatsApp checkout</text>
      </g>

      <!-- Item 4 (Live link banner) -->
      <g transform="translate(708, 0)">
        <rect width="220" height="230" rx="12" fill="#261E28" stroke="#48384D" stroke-width="1"/>
        <text x="20" y="40" fill="#2DD4BF" font-family="'DM Mono', monospace" font-size="11">LIVE PRODUCTION</text>
        <text x="20" y="75" fill="#F4EFE6" font-family="'Syne', sans-serif" font-weight="700" font-size="18">Shipped for Friend</text>
        <text x="20" y="105" fill="#8F8F9D" font-family="'Familjen Grotesk', sans-serif" font-size="12">Designed to build online credibility and drive sales directly through WhatsApp conversions.</text>
        <rect x="20" y="165" width="180" height="36" rx="8" fill="#2DD4BF" fill-opacity="0.2" stroke="#2DD4BF" stroke-width="1"/>
        <text x="110" y="188" fill="#2DD4BF" font-family="'DM Mono', monospace" font-size="11" text-anchor="middle">VISIT ARTZAWORLD.COM ↗</text>
      </g>
    </g>
  </g>
</svg>
